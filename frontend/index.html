<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Rolex Admin - Central Operations, Ledger & Banking System">
    <meta name="theme-color" content="#f5f6f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c100e" media="(prefers-color-scheme: dark)" />
    <title>Rolex Admin Panel</title>
    <script>
      // Apply the saved light/dark mode and color scheme before first paint to avoid a flash.
      (function () {
        try {
          var root = document.documentElement
          var saved = JSON.parse(localStorage.getItem('theme') || 'null')
          var mode = saved && saved.state && saved.state.mode
          if (!mode) {
            mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          root.classList.add(mode)
          if (saved) {
            var vars = JSON.parse(localStorage.getItem('theme-vars') || '{}')
            for (var key in vars) root.style.setProperty(key, vars[key])
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
